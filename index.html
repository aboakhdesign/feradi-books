<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ფერადი — საბავშვო წიგნები</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f6f2;
            color: #222;
        }

        header {
            background: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin: 8px 0 0;
            color: #777;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .book img {
            width: 100%;
            height: 290px;
            object-fit: cover;
        }

        .book-content {
            padding: 18px;
        }

        .book h2 {
            font-size: 20px;
            margin: 0 0 8px;
        }

        .author {
            color: #777;
            margin-bottom: 10px;
        }

        .description {
            font-size: 14px;
            line-height: 1.5;
            color: #555;
            min-height: 60px;
        }

        .read-button {
            display: block;
            text-align: center;
            background: #222;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .read-button:hover {
            opacity: 0.8;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>

<body>

<header>
    <h1>ფერადი</h1>
    <p>საბავშვო წიგნების ონლაინ ბიბლიოთეკა</p>
</header>

<div class="container">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="მოძებნე წიგნი..."
    >

    <div class="books" id="books"></div>

</div>

<footer>
    © 2026 ფერადი
</footer>

<script>

const books = [

    {
        title: "ჩემი პირველი წიგნი",
        author: "ავტორი",
        description: "საბავშვო წიგნის მოკლე აღწერა.",
        cover: "covers/book1.jpg",
        pdf: "books/book1.pdf"
    },

    {
        title: "ბავშვობის ამბები",
        author: "ავტორი",
        description: "თბილი და საინტერესო ისტორიები ბავშვებისთვის.",
        cover: "covers/book2.jpg",
        pdf: "books/book2.pdf"
    }

];

const booksContainer = document.getElementById("books");
const search = document.getElementById("search");

function showBooks(list) {

    booksContainer.innerHTML = "";

    list.forEach(book => {

        const element = document.createElement("div");

        element.className = "book";

        element.innerHTML = `
            <img src="${book.cover}" alt="${book.title}">

            <div class="book-content">

                <h2>${book.title}</h2>

                <div class="author">
                    ${book.author}
                </div>

                <div class="description">
                    ${book.description}
                </div>

                <a
                    class="read-button"
                    href="${book.pdf}"
                    target="_blank"
                >
                    წაიკითხე
                </a>

            </div>
        `;

        booksContainer.appendChild(element);

    });
}

search.addEventListener("input", function() {

    const text = search.value.toLowerCase();

    const filtered = books.filter(book =>
        book.title.toLowerCase().includes(text) ||
        book.author.toLowerCase().includes(text)
    );

    showBooks(filtered);

});

showBooks(books);

</script>

</body>
</html>
